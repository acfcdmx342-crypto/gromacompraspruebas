
<div class="w-100">
        <div class="card shadow p-4 mb-4">
        <h5 class="fw-bold mb-3 border-bottom pb-2 text-secondary">Nueva Solicitud</h5>
        <form id="formTec" class="row g-3">

            <div class="col-md-3"><label class="small fw-bold">Sucursal</label><input id="sucursal" class="form-control text-uppercase" placeholder="EJ: CENTRAL"></div>
            <div class="col-md-6">
                <label class="small fw-bold">Requisición (PDF/Imagen)</label>
                <div class="input-group">
                    <input id="archivo" type="file" class="form-control" onchange="previewArchivo(this)">
                    <div class="input-group-text">
  <input class="form-check-input" type="checkbox" id="checkLocal">
<label class="form-check-label small fw-bold ms-2 me-3" for="checkLocal">Local</label>

<label class="form-check-label small fw-bold ms-2" for="checkCenter">Color Center</label>

    </div>
    <div class="card shadow p-4 border-0">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h5 class="fw-bold m-0 text-secondary">Solicitudes en Proceso</h5>
            <div id="contenedorExportar"></div>
        </div>
        <div class="table-responsive">
            <table class="table table-bordered align-middle text-center bg-white">
                <thead class="table-primary">
                    <tr>
                        <th>Folio</th><th>Empresa</th><th>Zona</th><th>Sucursal</th>
                        <th>Tipo</th><th>Archivo</th><th>Status</th><th>Tiempo</th><th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="tablaTecBody"></tbody>
            </table>
        </div>
    </div>
</div>
<script type="module">
    import { database, ref, push, set, get, onValue, update, remove } from "./firebase.js";
    const sesion = JSON.parse(localStorage.getItem("usuarioLogueado") || "{}");
    if(!sesion.usuario) location.href = "index.html";
    window.nombreSesion = sesion.nombre;
    window.usuarioSesion = sesion.usuario;
    window.puestoSesion = (sesion.puesto || "").toUpperCase();
    const adminPuestos = ["GERENTE DE SISTEMAS", "JEFE DE INFRAESTRUCTURA Y SOPORTE TECNICO", "COORDINADOR DE SOPORTE TECNICO", "SOPORTE TECNICO SR", "SOPORTE TECNICO"];
    window.esAdmin = adminPuestos.includes(window.puestoSesion);
    window.esSoporteJR = window.puestoSesion === "SOPORTE TECNICO JR";
    window.esCoordinador = window.puestoSesion === "COORDINADOR DE SOPORTE TECNICO";  // 👉 valida permiso boton
    document.getElementById("usuarioActivo").textContent = window.nombreSesion;
    document.getElementById("puestoActivo").textContent = window.puestoSesion;
    document.getElementById("soporte").value = window.nombreSesion;
    const linkCCTV = document.getElementById("linkCCTV");
    const nombreLimpio = encodeURIComponent(window.nombreSesion);
    const puestoLimpio = encodeURIComponent(window.puestoSesion);
    linkCCTV.href = `catalogos.html?tipo=cctv&n=${nombreLimpio}&p=${puestoLimpio}`;
   if (window.esAdmin) {
        document.getElementById("liBase").innerHTML = '<a class="dropdown-item" href="base.html">🏠 Página Base</a>';
        document.getElementById("contenedorExportar").innerHTML = `<button class="btn btn-outline-success btn-sm fw-bold px-3" onclick="exportarExcel()">📊 Reporte</button>`;
    }
    const solicitudesRef = ref(database, "tecnologia");
    const seguimientoRef = ref(database, "seguimiento");
    const historialPermanenteRef = ref(database, "historial_permanente");
    let globalSeguimientos = [];
    let globalSolicitudes = [];
   onValue(seguimientoRef, snap => {
    globalSeguimientos = [];
    snap.forEach(c => { globalSeguimientos.push({ ...c.val(), id: c.key }); });

onValue(solicitudesRef, sSnap => {
    globalSolicitudes = [];
    sSnap.forEach(doc => { 
        const data = doc.val();
        if(!data.eliminado) globalSolicitudes.push({ ...data, id: doc.key }); 
    });
    renderTable(sSnap);
});
});
    function renderTable(snap) {
        const tbody = document.getElementById("tablaTecBody");
        tbody.innerHTML = ""; 
        snap.forEach(doc => {
            const s = doc.val();
            if (s.eliminado) return;
            const segsFolio = globalSeguimientos.filter(x => x.folio === s.folio).sort((a,b) => new Date(b.fechaRegistro) - new Date(a.fechaRegistro));
            const statusActual = segsFolio.length > 0 ? segsFolio[0].status : (s.status || "PENDIENTE");
            if (statusActual === "CONFIRMADO") return;
            const esLocal = s.solicitudLocal === true || s.isLocal === true || s.colorCenter === true;
            let badgeClass = "st-compras"; 
            if (statusActual === "EN ZONA" || statusActual === "ENVIADO A ZONA") badgeClass = "st-zona";
            else if (statusActual === "EN COTIZACION") badgeClass = "st-local-cotizacion";
            else if (statusActual === "DEVOLUCION") badgeClass = "st-devolucion";
            else if (statusActual === "PENDIENTE") badgeClass = "st-pendiente";
            else if (statusActual === "NO AUTORIZADO") badgeClass = "st-no-autorizado";
            if (window.esAdmin || s.usuario === window.usuarioSesion) {
                const tr = document.createElement("tr");
                if(esLocal) tr.classList.add("fila-local");
                tr.innerHTML = `
                    <td class="fw-bold">${s.folio}</td>
                    <td>${s.empresa}</td>
                    <td>${s.zona}</td>
                    <td>${s.sucursal}</td>
                    <td><span class="badge ${esLocal ? 'bg-warning text-dark' : 'bg-secondary'}">${s.colorCenter ? 'COLOR CENTER' : (esLocal ? 'LOCAL' : 'COMPRAS')}</span></td>
                    <td><button class="btn btn-sm btn-success" onclick="verPDF('${s.archivoData}', '${s.folio}')">👁️</button></td>
                    <td><span class="badge ${badgeClass} p-2 w-100">${statusActual}</span></td>
                    <td><small>${Math.floor((new Date() - new Date(s.fechaISO || s.fechaEnvio))/3600000)}h</small></td>
    <td>
    <div class="d-flex justify-content-center gap-2">
        <span class="action-btn" onclick="verHistorial('${s.folio}')" title="Historial">📜</span>
        <span class="action-btn text-primary" onclick="editarRegistro('${doc.key}')" title="Editar">✏️</span>

        ${window.esCoordinador ? `
<span class="action-btn text-danger" onclick="actualizarFolio('${doc.key}')" title="Actualizar Folio"><i class="fa-solid fa-hashtag"></i>
</span>
` : ''}
        ${statusActual === "NO AUTORIZADO" ? `
            <span class="action-btn text-danger" onclick="rechazarSolicitud('${doc.key}', '${s.folio}')" title="Enviar al Historial (Rechazado)">
                <i class="fa-solid fa-trash-can"></i>
            </span>
        ` : `
            ${esLocal ? 
                `<span class="action-btn text-info" onclick="modalSegLocal('${doc.key}', '${s.folio}')" title="Seguimiento Local">📋</span>` :
                `<span class="action-btn text-primary" onclick="window.location.href='seguimiento.html?folio=${s.folio}'" title="Seguimiento Compras">📋</span>`
            }
            ${(window.esSoporteJR || window.esAdmin) && (
                (esLocal && (statusActual === "EN ZONA" || statusActual === "DEVOLUCION")) || 
                (!esLocal && (statusActual === "ENVIADO A ZONA" || statusActual === "DEVOLUCION"))
            ) ? `
                <span class="action-btn text-success" onclick="confirmarEntrega('${doc.key}', '${s.folio}')" title="Confirmar Entrega"><i class="fa-solid fa-circle-check"></i></span>
                <span class="action-btn text-warning" onclick="enviarDevolucion('${doc.key}', '${s.folio}')" title="Devolución"><i class="fa-solid fa-arrow-rotate-left"></i></span>
            ` : ''}
        `}
    </div>
</td>                    
                `;
                tbody.appendChild(tr);
            }
        });
        document.getElementById("loader").style.display = "none";
    }

    // --- FUNCIÓN EXPORTAR EXCEL ---
window.exportarExcel = async () => {
    if (globalSolicitudes.length === 0) return Swal.fire("Aviso", "No hay datos para exportar", "warning");
    const workbook = new ExcelJS.Workbook();
    const worksheet = workbook.addWorksheet('Reporte de Solicitudes');
    const ahora = new Date(); // <--- SOLUCIÓN: Definir "ahora"
    let maxSeguimientos = 0;
    const datosParaExcel = globalSolicitudes.map(sol => {
        const seguimientos = globalSeguimientos
            .filter(seg => seg.folio === sol.folio)
            .sort((a, b) => new Date(a.fechaRegistro) - new Date(b.fechaRegistro));
        if (seguimientos.length > maxSeguimientos) maxSeguimientos = seguimientos.length;
        return { ...sol, listaSegs: seguimientos };
    });

    // SOLUCIÓN: Comas añadidas correctamente al final de cada objeto
    let columnas = [
        { header: 'FOLIO', key: 'folio', width: 20 },
        { header: 'EMPRESA', key: 'empresa', width: 15 },
        { header: 'ZONA', key: 'zona', width: 15 },
        { header: 'SUCURSAL', key: 'sucursal', width: 20 },
        { header: 'SOPORTE', key: 'soporte', width: 25 },
        { header: 'STATUS ACTUAL', key: 'status', width: 15 },
        { header: 'FECHA CREACIÓN', key: 'fecha', width: 22 },
        { header: 'FECHA ACTUAL', key: 'fecha_actual', width: 22 },
        { header: 'TIEMPO SOLICITUD', key: 'tiempo_solicitud', width: 25 }
    ];

    for (let i = 1; i <= maxSeguimientos; i++) {
        columnas.push({ header: `SEGUIMIENTO ${i}`, key: `seg_${i}`, width: 45 });
    }

    worksheet.columns = columnas;
    worksheet.getRow(1).font = { bold: true, color: { argb: 'FFFFFF' } };
    worksheet.getRow(1).fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: '0D6EFD' } };

    datosParaExcel.forEach(sol => {
        // Cálculo de tiempo
        const fechaInicio = sol.fechaISO ? new Date(sol.fechaISO) : new Date();
        const diferenciaMs = ahora - fechaInicio;
        
        const dias = Math.floor(diferenciaMs / (1000 * 60 * 60 * 24));
        const horas = Math.floor((diferenciaMs % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const minutos = Math.floor((diferenciaMs % (1000 * 60 * 60)) / (1000 * 60));
        const tiempoTranscurrido = `${dias}d ${horas}h ${minutos}m`;
        
        const statusFinal = sol.listaSegs.length > 0 ? sol.listaSegs[sol.listaSegs.length - 1].status : (sol.status || "PENDIENTE");

        // SOLUCIÓN: Estructura de fila limpia
        let fila = {
            folio: sol.folio,
            empresa: sol.empresa,
            zona: sol.zona,
            sucursal: sol.sucursal,
            soporte: sol.soporte,
            status: statusFinal,
            fecha: fechaInicio.toLocaleString(),
            fecha_actual: ahora.toLocaleDateString(),
            tiempo_solicitud: tiempoTranscurrido
        };

        sol.listaSegs.forEach((s, index) => {
            fila[`seg_${index + 1}`] = `[${s.status}] Art: ${s.descripcionArt || 'N/A'} - Obs: ${s.comentarios || 'S/O'}`;
        });

        worksheet.addRow(fila);
    });

    const buffer = await workbook.xlsx.writeBuffer();
    const blob = new Blob([buffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
    const url = window.URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `Reporte_Tecnologia_${ahora.toISOString().slice(0,10)}.xlsx`;
    a.click();
    window.URL.revokeObjectURL(url);
};  

    window.editarRegistro = async (idKey) => {
        try {
            const docRef = ref(database, `tecnologia/${idKey}`);
            const snap = await get(docRef);
            if (!snap.exists()) return;
            const data = snap.val();
            const { value: formValues } = await Swal.fire({
                title: 'Editar Solicitud',
                html: `
                    <div class="text-start">
                        <label class="fw-bold small mb-1">Empresa</label>
                        <input id="edit-empresa" class="form-control text-uppercase mb-3" value="${data.empresa}">
                        <label class="fw-bold small mb-1">Zona</label>
                        <input id="edit-zona" class="form-control text-uppercase mb-3" value="${data.zona}">
                        <label class="fw-bold small mb-1">Sucursal</label>
                        <input id="edit-sucursal" class="form-control text-uppercase" value="${data.sucursal}">
                    </div>
                `,
                showCancelButton: true,
                confirmButtonText: 'Actualizar',
                cancelButtonText: 'Cancelar',
                preConfirm: () => {
                    const empresa = document.getElementById('edit-empresa').value.trim();
                    const zona = document.getElementById('edit-zona').value.trim();
                    const sucursal = document.getElementById('edit-sucursal').value.trim();
                    if (!empresa || !zona || !sucursal) {
                        Swal.showValidationMessage('todos los campos son obligatorios');
                        return false;
                    }
                    return { empresa: empresa.toUpperCase(),zona: zona.toUpperCase(),sucursal: sucursal.toUpperCase() };
                }
            });
            if (formValues) {
                document.getElementById("loader").style.display = "flex";
                await update(docRef, formValues);
                document.getElementById("loader").style.display = "none";
                Swal.fire("Actualizado", "Los datos se han modificado correctamente", "success");
            }
        } catch (error) {
            console.error(error);
            document.getElementById("loader").style.display = "none";
            Swal.fire("Error", "No se pudo actualizar el registro", "error");
        }
    };

    window.confirmarEntrega = async (idKey, folio) => {
        const { value: formValues } = await Swal.fire({
            title: 'Confirmar Entrega',
            html: `
                <div class="text-start">
                    <p class="small text-muted mb-2">Folio: <b>${folio}</b></p>
                    <label class="fw-bold small mb-1">Imagen de Evidencia:</label>
                    <input type="file" id="evidencia-img" class="form-control mb-3" accept="image/*">
                    <div id="prev-evidencia" class="mb-3 text-center" style="display:none;">
                        <img id="img-render" src="" style="max-width:100%; height:150px; border-radius:10px; border:1px solid #ddd;">
                    </div>
                    <label class="fw-bold small mb-1">Motivo / Comentario de Recepción:</label>
                    <textarea id="evidencia-motivo" class="form-control text-uppercase" placeholder="EJ: EQUIPO ENTREGADO EN SUCURSAL FUNCIONANDO..." style="height:80px;"></textarea>
                </div>
            `,
            showCancelButton: true,
            confirmButtonText: '✅ Confirmar',
            didOpen: () => {
                const input = document.getElementById('evidencia-img');
                input.onchange = (e) => {
                    const file = e.target.files[0];
                    if (file) {
                        const reader = new FileReader();
                        reader.onload = (event) => {
                            document.getElementById('img-render').src = event.target.result;
                            document.getElementById('prev-evidencia').style.display = 'block';
                        };
                        reader.readAsDataURL(file);
                    }
                };
            },
            preConfirm: () => {
                const imgFile = document.getElementById('evidencia-img').files[0];
                const motivo = document.getElementById('evidencia-motivo').value;
                if (!imgFile) return Swal.showValidationMessage('Sube la imagen de evidencia');
                if (!motivo) return Swal.showValidationMessage('Escribe un comentario');
                return new Promise(resolve => {
                    const r = new FileReader();
                    r.onload = (e) => resolve({ img: e.target.result, mot: motivo.toUpperCase() });
                    r.readAsDataURL(imgFile);
                });
            }
        });

        if (formValues) {
            document.getElementById("loader").style.display = "flex";
            try {
                const solRef = ref(database, `tecnologia/${idKey}`);
                const snap = await get(solRef);
                const datosSolicitud = snap.val();
                const fechaOriginal = datosSolicitud.fechaISO || new Date().toISOString();
                const h = globalSeguimientos.filter(x => x.folio === folio);
                let art = "S/N";
                if (h.length > 0) {
                    art = h[0].descripcionArt || h[0].descripcion || "S/N";
                }
                const nuevoSeguimiento = {
                    folio, 
                    status: "CONFIRMADO", 
                    descripcionArt: art,
                    comentarios: formValues.mot,
                    evidenciaImagen: formValues.img, 
                    fechaRegistro: new Date().toISOString(), 
                    usuario: window.nombreSesion
                };
const todosSeguimientos = globalSeguimientos
    .filter(x => x.folio === folio)
    .sort((a,b) => new Date(a.fechaRegistro) - new Date(b.fechaRegistro));
    // agregar el último (confirmado)
todosSeguimientos.push(nuevoSeguimiento);
const datosHistorial = {
                    ...datosSolicitud,
                    status: "CONFIRMADO",
                    fechaISO: fechaOriginal,
                    descripcionArt: art,
                    fechaCierre: new Date().toISOString(),
                    evidenciaImagen: formValues.img,
                    comentarios: formValues.mot,
                    costo: h.length > 0 ? (h[h.length - 1].costoRefaccion || 0) : 0,
// 🔥 AQUÍ EL CAMBIO IMPORTANTE
seguimientos: todosSeguimientos
 };
                await push(historialPermanenteRef, datosHistorial);
                await push(seguimientoRef, nuevoSeguimiento);
                await remove(solRef);
                document.getElementById("loader").style.display = "none";
                await Swal.fire("Éxito", "Entrega confirmada y movida al historial", "success");
            } catch (error) {
                console.error(error);
                document.getElementById("loader").style.display = "none";
                Swal.fire("Error", "No se pudo procesar", "error");
            }
        }
    };

    window.enviarDevolucion = async (idKey, folio) => {
        const { value: formValues } = await Swal.fire({
            title: 'Reportar Devolución',
            html: `
                <div class="text-start">
                    <p class="small text-muted mb-2">Folio: <b>${folio}</b></p>
                    <label class="fw-bold small mb-1">Imagen de Evidencia (Devolución):</label>
                    <input type="file" id="dev-img" class="form-control mb-3" accept="image/*">
                    <div id="prev-dev" class="mb-3 text-center" style="display:none;">
                        <img id="img-dev-render" src="" style="max-width:100%; height:150px; border-radius:10px; border:1px solid #ddd;">
                    </div>
                    <label class="fw-bold small mb-1">Motivo de la Devolución:</label>
                    <textarea id="dev-motivo" class="form-control text-uppercase" placeholder="EJ: EL EQUIPO LLEGÓ DAÑADO..." style="height:80px;"></textarea>
                </div>
            `,
            showCancelButton: true,
            confirmButtonText: '🚀 Reportar',
            didOpen: () => {
                const input = document.getElementById('dev-img');
                input.onchange = (e) => {
                    const file = e.target.files[0];
                    if (file) {
                        const reader = new FileReader();
                        reader.onload = (event) => {
                            document.getElementById('img-dev-render').src = event.target.result;
                            document.getElementById('prev-dev').style.display = 'block';
                        };
                        reader.readAsDataURL(file);
                    }
                };
            },
            preConfirm: () => {
                const imgFile = document.getElementById('dev-img').files[0];
                const motivo = document.getElementById('dev-motivo').value;
                if (!imgFile) return Swal.showValidationMessage('Sube la foto de la devolución');
                if (!motivo) return Swal.showValidationMessage('Escribe el motivo');
                return new Promise(resolve => {
                    const r = new FileReader();
                    r.onload = (e) => resolve({ img: e.target.result, mot: motivo.toUpperCase() });
                    r.readAsDataURL(imgFile);
                });
            }
        });
        if (formValues) {
            document.getElementById("loader").style.display = "flex";
            try {
                const h = globalSeguimientos.filter(x => x.folio === folio);
                let art = "S/N";
                if (h.length > 0) {
                    art = h[0].descripcionArt || h[0].descripcion || "S/N";
                }
                const nuevoSeguimiento = {
                    folio, 
                    status: "DEVOLUCION", 
                    descripcionArt: art,
                    comentarios: formValues.mot,
                    evidenciaImagen: formValues.img,
                    fechaRegistro: new Date().toISOString(), 
                    usuario: window.nombreSesion
                };
                await push(seguimientoRef, nuevoSeguimiento);
                document.getElementById("loader").style.display = "none";
                await Swal.fire("Registrado", "Devolución reportada correctamente. La solicitud sigue en proceso.", "info");
            } catch (error) {
                console.error(error);
                document.getElementById("loader").style.display = "none";
                Swal.fire("Error", "No se pudo procesar", "error");
            }
        }
    };
// 👉 OPCIONES DE STATUS LOCAL COLORCENTER
       window.modalSegLocal = async (id, folio) => {
        // 1. Identificar si es Color Center
        const solActual = globalSolicitudes.find(s => s.id === id);
        const esColorCenter = solActual && (solActual.colorCenter === true || solActual.isLocal === true);

        // 2. Obtener el historial y el ÚLTIMO seguimiento registrado
        const historialPrevio = globalSeguimientos
            .filter(x => x.folio === folio)
            .sort((a, b) => new Date(a.fechaRegistro) - new Date(b.fechaRegistro));
        
        const ultimoSeg = historialPrevio.length > 0 ? historialPrevio[historialPrevio.length - 1] : null;

        // 3. Definir valores iniciales basados en el último registro
        const statusInicial = ultimoSeg ? ultimoSeg.status : "PENDIENTE";
        const articuloExistente = ultimoSeg ? (ultimoSeg.descripcionArt || "") : "";
        const codigoExistente = ultimoSeg ? (ultimoSeg.codigoRefaccion || "") : "";
        const costoExistente = ultimoSeg ? (ultimoSeg.costoRefaccion || "") : "";
        const esPrimerSeguimiento = historialPrevio.length === 0;

        const { value: formValues } = await Swal.fire({
            title: `Seguimiento ${esColorCenter ? 'a Solicitud' : 'Local'}<br><small class="text-muted">Folio: ${folio}</small>`,
            html: `
                <div class="text-start" style="font-size: 14px;">
                    <label class="fw-bold mb-1">Estado</label>
                    <select id="swal-status" class="form-select mb-3">
                        <option value="PENDIENTE" ${statusInicial === 'PENDIENTE' ? 'selected' : ''}>PENDIENTE</option>
                        <option value="EN COTIZACION" ${statusInicial === 'EN COTIZACION' ? 'selected' : ''}>EN COTIZACION</option>
                        <option value="COMPARATIVO" ${statusInicial === 'COMPARATIVO' ? 'selected' : ''}>COMPARATIVO</option>
                        <option value="AUTORIZADO" ${statusInicial === 'AUTORIZADO' ? 'selected' : ''}>AUTORIZADO</option>
                        <option value="EN ZONA" ${statusInicial === 'EN ZONA' ? 'selected' : ''}>EN ZONA</option>
                        <option value="NO AUTORIZADO" ${statusInicial === 'NO AUTORIZADO' ? 'selected' : ''}>NO AUTORIZADO</option>

                    ${esColorCenter ? `
                        <label class="fw-bold mb-1">Código de Refacción</label>

                    ` : ''}

                    <label class="fw-bold mb-1">Artículo / Equipo</label>
                    <input id="swal-art" class="form-control mb-3 text-uppercase" value="${articuloExistente}" ${!esPrimerSeguimiento ? 'readonly' : ''}>
                    
                    <div id="contenedor-costo" style="display: ${esColorCenter && (statusInicial === 'AUTORIZADO' || costoExistente) ? 'block' : 'none'};">
                        <label class="fw-bold mb-1">Costo de la Refacción</label>
                        <div class="input-group mb-3">
                            <span class="input-group-text">$</span>
                            <input id="swal-costo" type="number" step="0.01" class="form-control" value="${costoExistente}" placeholder="0.00">
                        </div>
                    </div>

                    <label class="fw-bold mb-1">Observaciones</label>
                    <textarea id="swal-com" class="form-control text-uppercase" style="height: 100px;"></textarea>
                </div>
            `,
            showCancelButton: true,
            confirmButtonText: '💾 Guardar',
            didOpen: () => {
                const selectStatus = document.getElementById('swal-status');
                const divCosto = document.getElementById('contenedor-costo');
                
                if (esColorCenter) {
                    selectStatus.addEventListener('change', () => {
                        // El costo se muestra si el status es AUTORIZADO o si ya había un costo previo cargado
                        if (selectStatus.value === 'AUTORIZADO' || costoExistente > 0) {
                            divCosto.style.display = 'block';
                        } else {
                            divCosto.style.display = 'none';
                        }
                    });
                }
            },
            preConfirm: () => {
                const art = document.getElementById('swal-art').value;
                if (!art) return Swal.showValidationMessage('Ingresa el artículo');
                
                const res = {
                    status: document.getElementById('swal-status').value,
                    descripcionArt: art.toUpperCase(),
                    comentarios: document.getElementById('swal-com').value.toUpperCase()
                };

                if (esColorCenter) {
                    res.codigoRefaccion = document.getElementById('swal-codigo').value.toUpperCase();
                    // Guardamos el costo si el campo es visible o si ya tenía valor
                    const inputCosto = document.getElementById('swal-costo');
                    if (inputCosto && inputCosto.value) {
                        res.costoRefaccion = inputCosto.value;
                    }
                }
                return res;
            }
        });

        if (formValues) {
            document.getElementById("loader").style.display = "flex";
            await push(seguimientoRef, { 
                folio, 
                ...formValues, 
                fechaRegistro: new Date().toISOString(), 
                usuario: window.nombreSesion 
            });
            document.getElementById("loader").style.display = "none";
            Swal.fire("Éxito", "Actualizado", "success");
        }
    };
   window.guardarSolicitud = async () => {
        const emp = document.getElementById("empresa").value;
        const zon = document.getElementById("zona").value;
        const suc = document.getElementById("sucursal").value;
        const arc = document.getElementById("archivo").files[0];
        const localCheck = document.getElementById("checkLocal").checked;
        const centerCheck = document.getElementById("checkCenter").checked;
// 👉 SI ES LOCAL O COLOR CENTER
const local = localCheck || centerCheck;
const colorCenter = centerCheck;

// 👉 DEFINICIÓN CORRECTA DEL TIPO
let tipo = "COMPRAS";
if (colorCenter) tipo = "COLOR CENTER";
else if (local) tipo = "LOCAL";
  if(!emp || !zon || !suc || !arc) return Swal.fire("Error", "Faltan campos por completar", "error");
// 🚫 Bloquear zonas genéricas
const zonasBloqueadas = ["CENTRO", "SUR", "NORTE"];
if(zonasBloqueadas.includes(zon.toUpperCase().trim())){
    return Swal.fire(
        "Zona inválida",
        "Ingresa tu zona correctamente",
        "ERROR DE CAPTURA"
    );
}
    document.getElementById("loader").style.display = "flex";
        const snap = await get(solicitudesRef);
        let contador = 1;
        if (snap.exists()) {
             contador = Object.keys(snap.val()).length + 1;
        }
        const reader = new FileReader();
        reader.onload = async () => {
            const fol = `TEC-${emp.substring(0,3)}-${zon.substring(0,3)}-${contador.toString().padStart(4, '0')}`.toUpperCase();
            await push(solicitudesRef, {
                folio: fol, 
                empresa: emp.toUpperCase(), 
                zona: zon.toUpperCase(), 
                sucursal: suc.toUpperCase(),
                soporte: window.nombreSesion, 
                puesto: window.puestoSesion,
                archivoData: reader.result, 
                status: local ? "PENDIENTE" : "EN COTIZACION", 
                 tipo: tipo,  // 🔥 AQUÍ ESTÁ LA CLAVE
                solicitudLocal: local,
                isLocal: local,
                colorCenter:colorCenter,
                fechaISO: new Date().toISOString(),
                usuario: window.usuarioSesion, 
                eliminado: false
            });
            document.getElementById("formTec").reset();
            document.getElementById("preview-container").innerHTML = '<small class="text-muted">Vista previa</small>';
            document.getElementById("loader").style.display = "none";
            Swal.fire("Éxito", "Solicitud guardada correctamente", "success")
            .then(() => {
    location.reload();
      });
   };
    reader.readAsDataURL(arc); 
    };
    window.verPDF = (base64, folio) => {
        const w = window.open();
        w.document.write(`<iframe src="${base64}" title="${folio}" style="width:100%; height:100%; border:none;"></iframe>`);
    };
// 👉 Modal Ver Historial
   window.verHistorial = (fol) => {
        const h = globalSeguimientos
            .filter(x => x.folio === fol)
            .sort((a,b) => new Date(a.fechaRegistro) - new Date(b.fechaRegistro));

        if(h.length === 0) return Swal.fire("Aviso", "No hay historial para este folio", "info");

        let rows = h.map(i => {
            // Formatear el costo si existe
            const costoFormateado = i.costoRefaccion 
                ? `<br><b>COSTO:</b> $${parseFloat(i.costoRefaccion).toLocaleString('es-MX', {minimumFractionDigits: 2})}` 
                : '';
            
            // Formatear el código si existe
            const codigoFormateado = i.codigoRefaccion 
                ? `<br><b>CÓDIGO:</b> ${i.codigoRefaccion}` 
                : '';

            return `
            <tr>
                <td>${new Date(i.fechaRegistro).toLocaleString()}</td>
                <td><span class="badge ${i.status === 'DEVOLUCION' ? 'st-devolucion' : 'bg-info'}">${i.status}</span></td>
                <td>
                    <b>ART:</b> ${i.descripcionArt || '-'}${codigoFormateado}${costoFormateado}
                    <br><b>OBS:</b> ${i.comentarios || '-'}<br>
                    ${i.evidenciaImagen ? `<a href="#" onclick="Swal.fire({imageUrl: '${i.evidenciaImagen}', imageWidth: 400})">Ver Evidencia</a>` : ''}
                </td>
            </tr>`;
        }).join('');

        Swal.fire({ 
            title: 'Historial ' + fol, 
            html: `
                <div class="table-responsive">
                    <table class="table table-sm small">
                        <thead>
                            <tr>
                                <th>Fecha</th>
                                <th>Status</th>
                                <th>Detalle</th>
                            </tr>
                        </thead>
                        <tbody>${rows}</tbody>
                    </table>
                </div>`, 
            width: '800px' 
        });
    };

    window.previewArchivo = (input) => {
        if(!input.files[0]) return;
        const reader = new FileReader();
        reader.onload = e => {
            document.getElementById("preview-container").innerHTML = input.files[0].type.includes("pdf") ? `<iframe src="${e.target.result}"></iframe>` : `<img src="${e.target.result}">`;
        };
        reader.readAsDataURL(input.files[0]);
    };
window.rechazarSolicitud = async (idKey, folio) => {
    const { value: motivo } = await Swal.fire({
        title: 'Finalizar Solicitud No Autorizada',
        text: `¿Deseas enviar el folio ${folio} al historial de rechazos?`,
        input: 'textarea',
        inputPlaceholder: 'Escribe el motivo del rechazo o comentario final...',
        inputAttributes: { 'class': 'text-uppercase' },
        showCancelButton: true,
        confirmButtonText: '🗑️ Enviar al Historial',
        confirmButtonColor: '#dc3545',
        preConfirm: (value) => {
            if (!value) return Swal.showValidationMessage('Debes indicar un motivo');
            return value.toUpperCase();
        }
    });

    if (motivo) {
        document.getElementById("loader").style.display = "flex";
        try {
            const solRef = ref(database, `tecnologia/${idKey}`);
            const snap = await get(solRef);
            const datosSolicitud = snap.val();
const todosSeguimientos = globalSeguimientos
    .filter(x => x.folio === folio)
    .sort((a,b) => new Date(a.fechaRegistro) - new Date(b.fechaRegistro));
            
            const datosHistorial = {
                ...datosSolicitud,
                status: "RECHAZADO / NO AUTORIZADO",
                tipo: datosSolicitud.tipo || "TECNOLOGÍA",
                fechaCierre: new Date().toISOString(),
                comentarios: motivo,
                 seguimientos: todosSeguimientos,
                usuarioFinalizo: window.nombreSesion
            };

            // 1. Guardar en historial permanente
            await push(historialPermanenteRef, datosHistorial);
            // 2. Eliminar de la tabla de procesos (solicitudes activas)
            await remove(solRef);

            document.getElementById("loader").style.display = "none";
            Swal.fire("Finalizado", "El registro ha sido movido al historial", "success");
        } catch (error) {
            console.error(error);
            document.getElementById("loader").style.display = "none";
            Swal.fire("Error", "No se pudo procesar la acción", "error");
        }
    }
};
// 👉 actualizacion de folio  en todo
window.actualizarFolio = async (idKey) => {
    try {
        const docRef = ref(database, `tecnologia/${idKey}`);
        const snap = await get(docRef);
        if (!snap.exists()) {
            return Swal.fire("Error", "No existe el registro", "error");
        }
        const data = snap.val();
        const folioActual = data.folio;
        const { value: nuevoFolio } = await Swal.fire({
            title: 'Actualizar Folio',
            html: `
                <div class="text-start">
                    <label class="fw-bold mb-2">Folio Actual</label>
                    <input class="form-control mb-3" value="${folioActual}" readonly>
                    <label class="fw-bold mb-2">Nuevo Folio</label>
                    <input id="nuevo-folio"
                           class="form-control text-uppercase"
                           value="${folioActual}">
                </div>
            `,
            showCancelButton: true,
            confirmButtonText: '🔄 Actualizar',
            cancelButtonText: 'Cancelar',
            preConfirm: async () => {
                const nuevo =
                    document.getElementById('nuevo-folio')
                    .value
                    .trim()
                    .toUpperCase();
                if (!nuevo) {
                    Swal.showValidationMessage('Ingresa el nuevo folio');
                    return false;
                }
                if (nuevo === folioActual) {
                    Swal.showValidationMessage('El folio es igual al actual');
                    return false;
                }
                // 🔥 VALIDAR DUPLICADOS
                const tecSnap = await get(solicitudesRef);
                let existe = false;
                tecSnap.forEach(c => {
                    const d = c.val();
                    if (
                        d.folio === nuevo &&
                        c.key !== idKey
                    ) {
                        existe = true;
                    }
                });
                if (existe) {
                    Swal.showValidationMessage(
                        'Ese folio ya existe'
                    );
                    return false;
                }
                return nuevo;
            }
        });
        if (!nuevoFolio) return;
        document.getElementById("loader").style.display = "flex";
        // ===================================================
        // 1. ACTUALIZAR TECNOLOGIA
        // ===================================================
        await update(docRef, {
            folio: nuevoFolio
        });
        // ===================================================
        // 2. ACTUALIZAR SEGUIMIENTOS
        // ===================================================
       const segSnap = await get(seguimientoRef);
        if (segSnap.exists()) {
            const updatesSeg = {};
            segSnap.forEach(child => {
                const seg = child.val();
                if (seg.folio === folioActual) {
                    updatesSeg[
                        `${child.key}/folio`
                    ] = nuevoFolio;
                }
            });
            if (Object.keys(updatesSeg).length > 0) {
                await update(seguimientoRef, updatesSeg);
            }
        }
        // ===================================================
        // 3. ACTUALIZAR HISTORIAL PERMANENTE
        // ===================================================
        const histSnap = await get(historialPermanenteRef);
        if (histSnap.exists()) {
            const updatesHist = {};
            histSnap.forEach(child => {
                const hist = child.val();
                // ACTUALIZA FOLIO PRINCIPAL
                if (hist.folio === folioActual) {
                    updatesHist[
                        `${child.key}/folio`
                    ] = nuevoFolio;
                }
                // ACTUALIZA SEGUIMIENTOS INTERNOS
                if (hist.seguimientos) {
                   Object.keys(hist.seguimientos)
                    .forEach(k => {
                       const segInterno =
                            hist.seguimientos[k];
                        if (
                            segInterno.folio === folioActual
                        ) {
                            updatesHist[
                                `${child.key}/seguimientos/${k}/folio`
                            ] = nuevoFolio;
                        }
                    });
                }
            });
            if (Object.keys(updatesHist).length > 0) {

                await update(
                    historialPermanenteRef,
                    updatesHist
                );
            }
        }
        document.getElementById("loader").style.display = "none";
        Swal.fire({
            icon: 'success',
            title: 'Folio Actualizado',
            html: `
                <b>Anterior:</b> ${folioActual}
                <br>
                <b>Nuevo:</b> ${nuevoFolio}
            `
        });
    } catch (error) {
        console.error(error);
        document.getElementById("loader").style.display = "none";
        Swal.fire(
            "Error",
            "No se pudo actualizar el folio",
            "error"
        );
    }
};

    window.cerrarSesion = () => { localStorage.clear(); location.href = "index.html"; };
